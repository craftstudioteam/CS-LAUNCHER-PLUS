name: Build CS Launcher Plus APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: CS-Launcher-Plus-Debug-APK
        path: app_pojavlauncher/build/outputs/apk/debug/*.apk

    - name: Publish Release APK
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.1.0-plus
        name: CS Launcher Plus v3.1.0
        body: |
          ### CS Launcher Plus v3.1.0 (Build Artifact)
          - Updated application package name to `com.cslaucher.plus`
          - Integrated updated Firebase `google-services.json`
          - Redesigned Client Download & Installation UI with holographic cyber gyroscope rings and live stage telemetry
          - Redesigned Shortcut Creator UI for 1-tap desktop shortcuts
        files: app_pojavlauncher/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
