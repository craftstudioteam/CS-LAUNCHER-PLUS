name: Build APK

# Build-only workflow: compiles the debug and release APKs and uploads them as run artifacts.
# It never creates a GitHub Release.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app_pojavlauncher/google-services.json
            echo "Using google-services.json from the GOOGLE_SERVICES_JSON secret."
          else
            # The google-services Gradle plugin is applied unconditionally and fails without this file.
            cp .github/ci/google-services.placeholder.json app_pojavlauncher/google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set. This build uses a placeholder, so Firebase features are disabled."
          fi

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS-Launcher-Plus-APKs
          path: app_pojavlauncher/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
